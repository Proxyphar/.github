# Serveur par défaut : toute requête qui ne vise pas intranet.proxyphar.fr (IP nue,
# vps-322ffb27.vps.ovh.net, autre nom) est refusée sans réponse.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name _;
    # Refuse la négociation TLS quand le SNI ne correspond à aucun site : aucun certificat
    # n'est présenté, le CMS n'est pas servi.
    ssl_reject_handshake on;
}
