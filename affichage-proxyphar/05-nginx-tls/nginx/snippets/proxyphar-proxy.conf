# Paramètres communs de relais vers le conteneur cms-web (127.0.0.1:8080).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
proxy_connect_timeout 60s;
# Les délais de lecture/écriture sont fixés dans chaque location (600 s ; 3600 s pour /xmr).
# Pas de mise en tampon : les envois de médias (jusqu'à 2 Go) et les téléchargements des
# players sont transmis en flux, sans fichier temporaire sur le disque de 80 Go.
proxy_buffering off;
proxy_request_buffering off;
proxy_hide_header X-Content-Type-Options;
