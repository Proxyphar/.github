# En-têtes de sécurité ajoutés par Nginx (« always » : aussi sur les réponses d'erreur).
# Le CMS ajoute lui-même Content-Security-Policy et X-Frame-Options ; X-Content-Type-Options
# est masqué côté proxy (proxyphar-proxy.conf) puis réémis ici pour éviter un doublon.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), payment=()" always;
