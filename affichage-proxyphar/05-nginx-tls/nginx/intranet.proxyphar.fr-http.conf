# intranet.proxyphar.fr — port 80 : validation Let's Encrypt et redirection vers HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name intranet.proxyphar.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://intranet.proxyphar.fr$request_uri;
    }
}
