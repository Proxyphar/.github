# intranet.proxyphar.fr — port 443 : reverse proxy vers le CMS Xibo (cms-web).
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name intranet.proxyphar.fr;

    ssl_certificate     /etc/letsencrypt/live/intranet.proxyphar.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/intranet.proxyphar.fr/privkey.pem;
    include snippets/proxyphar-ssl.conf;
    include snippets/proxyphar-headers.conf;

    access_log /var/log/nginx/affichage.access.log;
    error_log  /var/log/nginx/affichage.error.log;

    # Cohérent avec CMS_PHP_UPLOAD_MAX_FILESIZE=2G dans /opt/affichage/config.env.
    client_max_body_size 2048m;

    # XMR (messages push vers les players) : WebSocket relayé par Apache dans cms-web.
    location = /xmr {
        proxy_pass http://127.0.0.1:8080;
        include snippets/proxyphar-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include snippets/proxyphar-proxy.conf;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
