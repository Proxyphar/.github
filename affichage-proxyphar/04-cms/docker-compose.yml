# Xibo CMS 4.5.2 — PROXYPHAR — /opt/affichage/docker-compose.yml
# Dérivé du fichier officiel xibo-docker 4.5.2 (cms_custom-ports.yml.template) avec :
#   - tags d'images figés (aucun « latest ») ;
#   - CMS publié uniquement sur 127.0.0.1:8080 (Nginx en frontal) ;
#   - base de données et XMR sans aucun port publié ;
#   - sous-réseau Docker fixe (172.28.0.0/24) pour la liste des proxys de confiance.
name: affichage

services:
  cms-db:
    image: mysql:8.4.11
    volumes:
      - "./shared/db:/var/lib/mysql:Z"
    environment:
      - MYSQL_DATABASE=cms
      - MYSQL_USER=cms
      - MYSQL_RANDOM_ROOT_PASSWORD=yes
    env_file: config.env
    mem_limit: 1g
    restart: always
    # Aucun port publié : la base n'est joignable que depuis le réseau Docker interne.

  cms-xmr:
    image: ghcr.io/xibosignage/xibo-xmr:1.3
    env_file: config.env
    mem_limit: 256m
    restart: always
    # Aucun port publié : les players utilisent le WebSocket relayé par cms-web (/xmr)
    # à travers Nginx (wss://intranet.proxyphar.fr/xmr). Le port ZeroMQ 9505 (players v3)
    # n'est volontairement pas exposé (voir 09-docs/05-points-de-vigilance.md).

  cms-web:
    image: ghcr.io/xibosignage/xibo-cms:release-4.5.2
    volumes:
      - "./shared/cms/custom:/var/www/cms/custom:Z"
      - "./shared/backup:/var/www/backup:Z"
      - "./shared/cms/library:/var/www/cms/library:Z"
      - "./shared/cms/web/userscripts:/var/www/cms/web/userscripts:Z"
      - "./shared/cms/ca-certs:/var/www/cms/ca-certs:Z"
    environment:
      - MYSQL_HOST=cms-db
      - XMR_HOST=cms-xmr
      - CMS_USE_MEMCACHED=true
      - MEMCACHED_HOST=cms-memcached
    env_file: config.env
    ports:
      - "127.0.0.1:8080:80"
    mem_limit: 1g
    restart: always
    depends_on:
      - cms-db
      - cms-xmr
      - cms-memcached

  cms-memcached:
    image: memcached:1.6.45-alpine
    command: memcached -m 15
    mem_limit: 100m
    restart: always

  cms-quickchart:
    image: ianw/quickchart:v1.8.1
    mem_limit: 256m
    restart: always

networks:
  default:
    name: affichage_default
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1
